[alias]
b = "build"
bj = "build -j 3"
c = "check"
cl = "clean"
t = "test"
r = "run"
rr = "run --release"
recursive_example = "rr --example recursions"

[build]
warnings = "deny"
jobs = 1
rustc = "rustc"
rustc-wrapper = "sccache"
rustdoc = "rustdoc"
rustdocflags = ["--deny-warnings"]
incremental = false
rustflags = [
    "-D", "warnings",
    "-C", "panic=abort",
    "-C", "overflow-checks=on",
    "-C", "force-unwind-tables=no",
]

[unstable]
build-std = [
    "core", "alloc"
]

[target.riscv32imac-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-TRISC-V-linker.ld",
    "-C", "link-arg=--nmagic",
]

[profile.dev]
panic = "abort"
overflow-checks = true
debug-assertions = true

[profile.release]
panic = "abort"
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = "debuginfo"
